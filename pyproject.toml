[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-v2"
version = "0.1.0"
description = "Zero v2 — Telegram-based AI collaboration platform for development teams"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Zero Team" }]
readme = "README.md"

dependencies = [
    "aiogram>=3.13,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "structlog>=24.1,<25.0",
    "anyio>=4.3,<5.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "cryptography>=42.0,<46.0",
    "ulid-py>=1.1,<2.0",
    "pyyaml>=6.0,<7.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
    "click>=8.1,<9.0",
    "rich>=13.7,<14.0",
    "python-ulid>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.12,<4.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "respx>=0.21,<1.0",
    "freezegun>=1.5,<2.0",
    "hypothesis>=6.100,<7.0",
]

[project.scripts]
zero = "zero.cli:main"
zero-migrate = "zero.cli.migrate:main"

[tool.setuptools.packages.find]
include = ["zero*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
files = ["zero"]

[[tool.mypy.overrides]]
module = ["aiogram.*", "ulid.*", "python_ulid.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["zero", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "B",              # bugbear
    "C4",             # comprehensions
    "UP",             # pyupgrade
    "RUF",            # ruff-specific
    "SIM",            # simplify
    "TID",            # tidy-imports
    "PTH",            # use-pathlib
    "ASYNC",          # async checks
    "S",              # bandit security
    "A",              # builtin-shadowing
    "DTZ",            # datetime-zones
    "PL",             # pylint
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # assert usage in tests
    "PLR0913", # too many args (acceptable in well-typed APIs)
    "PLR2004", # magic numbers in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR", "B"]
"zero/contracts/**/*" = ["S"]
"zero/platform/__init__.py" = ["A005"]  # shadows stdlib platform, but we use zero.platform fully-qualified
"zero/core/logging.py" = ["A005"]  # shadows stdlib logging, but we use zero.core.logging explicitly

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--cov=zero",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=50",
]
markers = [
    "unit: fast unit tests (<10ms each)",
    "integration: real DB / multiple components",
    "contract: boundary contract tests",
    "adversarial: deliberate break attempts",
    "e2e: full user scenario",
    "slow: tests that take >1s",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiogram.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source = ["zero"]
branch = true
omit = [
    "zero/contracts/*",
    "zero/cli/__main__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]
fail_under = 80
show_missing = true

[tool.coverage.paths]
source = ["zero/"]
