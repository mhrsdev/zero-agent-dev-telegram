name: platform-matrix

on:
  push:
    branches: [main, feat/management-layer]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check --no-cache src tests scripts
      - run: ruff format --check --no-cache src tests scripts
      - run: python -m compileall -q src tests scripts

  tests-linux:
    runs-on: ubuntu-22.04
    env:
      ZERO_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: git identity for worktree tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - run: pytest -p no:cacheprovider --tb=short

  tests-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: false
    env:
      ZERO_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -p no:cacheprovider --tb=short -q

  tests-debian12:
    runs-on: ubuntu-22.04
    container:
      image: debian:12
    env:
      ZERO_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - run: apt-get update -y && apt-get install -y python3 python3-venv python3-pip git ca-certificates
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -U pip && /tmp/venv/bin/pip install -e ".[dev]"
      - run: /tmp/venv/bin/python -m pytest -p no:cacheprovider -q --tb=short

  windows-dev:
    runs-on: windows-latest
    continue-on-error: true   # development-only target; POSIX-gated tests self-skip
    env:
      ZERO_ENV: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -p no:cacheprovider --tb=short -q

  installer-container:
    runs-on: ubuntu-22.04
    container:
      image: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: run installer (no systemd inside container)
        run: sh scripts/install.sh
        env:
          ZERO_INSTALL_BASE: ""
      - name: verify entrypoints + migrations
        run: |
          /opt/zero/venv/bin/zero-develop --version
          /opt/zero/venv/bin/zero --version
          sudo -u zero env ZERO_HOME=/var/lib/zero \
            /opt/zero/venv/bin/zero-develop migrate | grep '"applied"'
          test -f /etc/systemd/system/zero.service || \
            echo "systemd absent in container; unit file still written"

  upgrade-path:
    runs-on: ubuntu-22.04
    env:
      ZERO_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install previous commit
        run: |
          git checkout HEAD~1
          pip install -e ".[dev]"
      - name: migrate on old schema
        run: |
          export ZERO_DATABASE_URL="sqlite:///$RUNNER_TEMP/upg.db"
          python -c "from zero.cli import main; main(['migrate'])"
      - name: upgrade to current and re-migrate (idempotent)
        run: |
          git checkout "$GITHUB_SHA"
          pip install -e ".[dev]" --force-reinstall
          python -c "from zero.cli import main; print(main(['migrate']))"
          python -c "from zero.cli import main; main(['migrate'])"

  security-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --skip-editable || true   # advisory report; gate separately once baseline clean
