services:
  zero:
    image: python:3.12-slim
    working_dir: /app
    environment:
      ZERO_ENV: production
      ZERO_HOME: /data
      ZERO_DATABASE_URL: sqlite:////data/zero.db
    env_file:
      - ./zero.env
    volumes:
      - ./:/app
      - zero-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -lc "pip install --no-cache-dir -e . &&
              zero-develop migrate &&
              uvicorn zero.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
volumes:
  zero-data:
